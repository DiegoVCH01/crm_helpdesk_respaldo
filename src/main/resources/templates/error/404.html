<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>404 - Página no encontrada | ServiClient</title>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                font-family: Arial, sans-serif;
                background: #f7f8fc;
                color: #0f172a;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .error-container {
                width: 100%;
                max-width: 620px;
                text-align: center;
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 20px;
                padding: 56px 40px;
                box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
            }

            .logo {
                width: 58px;
                height: 58px;
                margin: 0 auto 24px;
                border-radius: 14px;
                background: #6366f1;
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
                font-weight: 700;
                box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
            }

            .error-code {
                font-size: 76px;
                line-height: 1;
                font-weight: 800;
                color: #6366f1;
                margin-bottom: 18px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 14px;
            }

            p {
                color: #64748b;
                font-size: 16px;
                line-height: 1.6;
                margin-bottom: 32px;
            }

            .actions {
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            }

            .btn {
                display: inline-block;
                padding: 12px 22px;
                border-radius: 10px;
                text-decoration: none;
                font-weight: 600;
                transition: 0.2s ease;
            }

            .btn-primary {
                background: #6366f1;
                color: #ffffff;
            }

            .btn-primary:hover {
                background: #4f46e5;
            }

            .btn-secondary {
                border: 1px solid #cbd5e1;
                color: #334155;
                background: #ffffff;
            }

            .btn-secondary:hover {
                background: #f8fafc;
            }
        </style>
    </head>

    <body>
        <div class="error-container">
            <div class="logo">S</div>

            <div class="error-code">404</div>

            <h1>Página no encontrada</h1>

            <p>El recurso que intentas consultar no existe o no está disponible para tu empresa.</p>

            <div class="actions">
                <a th:href="@{/dashboard}" class="btn btn-primary">Ir al Dashboard</a>

                <a th:href="@{/clientes}" class="btn btn-secondary">Ver clientes</a>
            </div>
        </div>
    </body>
</html>
