<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Acceso denegado - ServiClient</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f8fafc;
                font-family: Arial, sans-serif;
                color: #0f172a;
            }

            .error-card {
                width: 100%;
                max-width: 520px;
                background: #ffffff;
                padding: 48px;
                border-radius: 18px;
                border: 1px solid #e2e8f0;
                text-align: center;
                box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            }

            .logo {
                width: 80px;
                height: 80px;
                object-fit: contain;
                margin-bottom: 18px;
            }

            .code {
                font-size: 72px;
                font-weight: 800;
                color: #6366f1;
                margin: 0;
            }

            h1 {
                margin: 8px 0 12px;
                font-size: 26px;
            }

            p {
                color: #64748b;
                line-height: 1.6;
                margin-bottom: 28px;
            }

            a {
                display: inline-block;
                padding: 12px 22px;
                background: #6366f1;
                color: #ffffff;
                text-decoration: none;
                border-radius: 9px;
                font-weight: 700;
            }

            a:hover {
                background: #4f46e5;
            }
        </style>
    </head>

    <body>
        <div class="error-card">
            <img th:src="@{/img/logo-icono.png}" class="logo" alt="ServiClient" />

            <div class="code">403</div>

            <h1>Acceso denegado</h1>

            <p>No tienes permisos para acceder a este módulo con el rol asignado a tu cuenta.</p>

            <a th:href="@{/dashboard}">Volver al Dashboard</a>
        </div>
    </body>
</html>
