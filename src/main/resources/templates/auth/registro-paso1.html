<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro de Empresa (Paso 1) - ServiClient</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
    </head>
    <body style="background-color: #f8fafc">
        <div class="auth-wrapper">
            <div class="auth-card" style="max-width: 650px">
                <div class="auth-header">
                    <div class="auth-logo">
                        <img th:src="@{/img/logo-icono.png}" alt="ServiClient" />
                    </div>
                    <h1 class="auth-title">ServiClient</h1>
                    <p class="auth-subtitle">Gestión inteligente de clientes y soporte</p>

                    <div class="auth-tabs">
                        <a th:href="@{/login}" class="auth-tab">Iniciar sesión</a>
                        <a th:href="@{/registro/paso-1}" class="auth-tab active">Registrarse</a>
                    </div>
                </div>

                <div class="auth-body">
                    <!-- Wizard Steps Indicator -->
                    <div class="wizard-steps">
                        <div class="wizard-step-circle active">1</div>
                        <div class="wizard-step-circle">2</div>
                        <div class="wizard-step-circle">3</div>
                    </div>

                    <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 20px">Información de la Empresa</h2>
                    <!-- Guava Preconditions -->
                    <div
                        th:if="${errorMessage != null}"
                        style="
                            background-color: #fef2f2;
                            border: 1px solid #fecaca;
                            color: #991b1b;
                            padding: 12px 16px;
                            border-radius: 8px;
                            font-weight: 500;
                            font-size: 13.5px;
                            margin-bottom: 20px;
                        ">
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <!-- FIN: Alerta -->

                    <form th:action="@{/registro/paso-1}" th:object="${registroForm}" method="post">
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">Nombre Comercial</label>
                                <input type="text" th:field="*{nombreComercial}" class="form-input" placeholder="Ej. Acme Corp" required />
                            </div>
                            <div class="form-group">
                                <label class="form-label">Razón Social</label>
                                <input
                                    type="text"
                                    th:field="*{razonSocial}"
                                    class="form-input"
                                    placeholder="Ej. Acme Corporation S.A.C."
                                    required />
                            </div>
                        </div>

                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">RUC / Identificación Fiscal</label>
                                <input type="text" th:field="*{ruc}" class="form-input" placeholder="20123456789" required />
                            </div>

                            <div class="form-group">
                                <label class="form-label">Industria</label>
                                <input type="text" th:field="*{industria}" class="form-input" placeholder="Software, Finanzas, etc." />
                            </div>
                        </div>

                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">Tamaño de Empresa</label>

                                <select th:field="*{tamanoEmpresa}" class="form-select">
                                    <option value="">Seleccionar tamaño</option>
                                    <option value="Microempresa">Microempresa</option>
                                    <option value="Pequeña">Pequeña</option>
                                    <option value="Mediana">Mediana</option>
                                    <option value="Grande">Grande</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Sitio Web</label>

                                <input type="url" th:field="*{sitioWeb}" class="form-input" placeholder="https://empresa.com" />
                            </div>
                        </div>

                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">País</label>
                                <select th:field="*{pais}" class="form-select">
                                    <option value="">Seleccionar país</option>
                                    <option value="Perú" selected>Perú</option>
                                    <option value="Colombia">Colombia</option>
                                    <option value="México">México</option>
                                    <option value="Chile">Chile</option>
                                    <option value="Argentina">Argentina</option>
                                    <option value="España">España</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ciudad</label>
                                <input type="text" th:field="*{ciudad}" class="form-input" placeholder="Lima, Bogotá, etc." />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-input" placeholder="Av. Principal 123" />
                        </div>

                        <div class="form-group">
                            <label class="form-label">Logo de la Empresa</label>
                            <div
                                style="
                                    border: 2px dashed var(--color-border);
                                    border-radius: var(--radius-md);
                                    padding: 24px;
                                    text-align: center;
                                    background-color: #f8fafc;
                                    color: var(--color-text-muted);
                                    cursor: pointer;
                                ">
                                <svg
                                    style="width: 28px; height: 28px; margin: 0 auto 6px auto; color: var(--color-text-sub)"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                </svg>
                                <div style="font-size: 13px; font-weight: 500">Subir logo (.png, .jpg)</div>
                                <input type="hidden" th:field="*{logoUrl}" />
                            </div>
                        </div>

                        <div
                            style="
                                display: flex;
                                justify-content: flex-end;
                                margin-top: 28px;
                                padding-top: 20px;
                                border-top: 1px solid var(--color-border-light);
                            ">
                            <button type="submit" class="btn btn-primary" style="padding: 10px 28px">Siguiente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
