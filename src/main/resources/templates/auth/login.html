<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Acceso y Registro - ServiClient</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
    </head>
    <body style="background-color: #f8fafc">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <img th:src="@{/img/logo-icono.png}" alt="ServiClient" />
                    </div>
                    <h1 class="auth-title">ServiClient</h1>
                    <p class="auth-subtitle">Gestión inteligente de clientes y soporte</p>

                    <div class="auth-tabs">
                        <a th:href="@{/login}" class="auth-tab active">Iniciar sesión</a>
                        <a th:href="@{/registro/paso-1}" class="auth-tab">Registrarse</a>
                    </div>
                </div>

                <div class="auth-body">
                    <!-- Alerts -->
                    <div
                        th:if="${errorMessage != null}"
                        style="
                            background-color: #fef2f2;
                            border: 1px solid #fecaca;
                            color: #991b1b;
                            padding: 12px 16px;
                            border-radius: 8px;
                            font-weight: 500;
                            font-size: 13.5px;
                            margin-bottom: 20px;
                        ">
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <div
                        th:if="${successMessage != null}"
                        style="
                            background-color: #ecfdf5;
                            border: 1px solid #a7f3d0;
                            color: #065f46;
                            padding: 12px 16px;
                            border-radius: 8px;
                            font-weight: 500;
                            font-size: 13.5px;
                            margin-bottom: 20px;
                        ">
                        <span th:text="${successMessage}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <div style="position: relative">
                                <input
                                    type="email"
                                    name="email"
                                    class="form-input"
                                    placeholder="tu@empresa.com"
                                    required
                                    value="admin@serviclient.com" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-input" placeholder="••••••••" required value="admin123" />
                        </div>

                        <div
                            style="
                                display: flex;
                                align-items: center;
                                justify-content: space-between;
                                margin-bottom: 24px;
                                font-size: 13px;
                            ">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--color-text-muted)">
                                <input type="checkbox" name="remember-me" />
                                <span>Recordarme</span>
                            </label>
                            <a href="#" style="color: var(--color-primary); text-decoration: none; font-weight: 600">
                                Olvidé mi contraseña
                            </a>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px">
                            Iniciar sesión
                        </button>
                    </form>

                    <div
                        style="
                            margin-top: 24px;
                            padding-top: 16px;
                            border-top: 1px solid var(--color-border-light);
                            font-size: 12.5px;
                            color: var(--color-text-muted);
                            text-align: center;
                        ">
                        <strong>Credenciales Demo:</strong>
                        admin@serviclient.com / admin123
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
