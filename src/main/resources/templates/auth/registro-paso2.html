<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empresa (Paso 2) - ServiClient</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="background-color: #F8FAFC;">
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 650px;">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                <h1 class="auth-title">ServiClient</h1>
                <p class="auth-subtitle">Gestión inteligente de clientes y soporte</p>

                <div class="auth-tabs">
                    <a th:href="@{/login}" class="auth-tab">Iniciar sesión</a>
                    <a th:href="@{/registro/paso-1}" class="auth-tab active">Registrarse</a>
                </div>
            </div>

            <div class="auth-body">
                <!-- Wizard Steps Indicator -->
                <div class="wizard-steps">
                    <div class="wizard-step-circle completed">1</div>
                    <div class="wizard-step-circle active">2</div>
                    <div class="wizard-step-circle">3</div>
                </div>

                <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">Usuario Administrador</h2>
                <!-- Guava Preconditions -->
                <div th:if="${errorMessage != null}" style="background-color: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; padding: 12px 16px; border-radius: 8px; font-weight: 500; font-size: 13.5px; margin-bottom: 20px;">
                    <span th:text="${errorMessage}"></span>
                </div>

                <p style="color: var(--color-text-muted); font-size: 13.5px; margin-bottom: 22px;">Crea la cuenta principal que administrará ServiClient.</p>

                <form th:action="@{/registro/paso-2}" th:object="${registroForm}" method="post">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{adminNombre}" class="form-input" placeholder="Ej. Juan" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{adminApellido}" class="form-input" placeholder="Ej. Pérez" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" th:field="*{adminEmail}" class="form-input" placeholder="admin@empresa.com" required>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{adminPassword}" class="form-input" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirmar Contraseña</label>
                            <input type="password" th:field="*{adminPasswordConfirm}" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px; color: #4F46E5; font-size: 13px; font-weight: 600; margin-bottom: 24px;">
                        <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                        <span>Rol asignado: Administrador</span>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--color-border-light);">
                        <a th:href="@{/registro/paso-1}" class="btn btn-secondary" style="padding: 10px 24px;">
                            Atrás
                        </a>
                        <button type="submit" class="btn btn-primary" style="padding: 10px 28px;">
                            Siguiente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
