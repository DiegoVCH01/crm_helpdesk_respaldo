<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar Contraseña - Portal del Cliente</title>
    <!-- Hoja de estilos principal del proyecto -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        .modal-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 480px;
            padding: 32px 36px;
        }

        /* Encabezado del modal */
        .modal-header-custom {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }

        .modal-icon-circle {
            width: 44px;
            height: 44px;
            background-color: #f3e8ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c3aed;
            flex-shrink: 0;
        }

        .modal-title-text {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px 0;
        }

        .modal-subtitle-text {
            font-size: 13px;
            color: #6b7280;
            margin: 0;
            line-height: 1.4;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .input-icon-left {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
            height: 18px;
            pointer-events: none;
            z-index: 2;
        }

        .input-icon-wrapper .input-icon-right {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
            height: 18px;
            cursor: pointer;
            z-index: 2;
        }

        .input-icon-wrapper .form-input {
            padding-left: 42px;
            padding-right: 42px;
            background-color: #ffffff !important;
            color: #111827;
        }

        .field-help-text {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #10b981;
            margin-top: 6px;
            font-weight: 500;
        }

        .info-box-purple {
            background-color: #faf5ff;
            border: 1px solid #f3e8ff;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 20px;
            margin-bottom: 28px;
        }

        .info-box-purple svg {
            color: #7c3aed;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .info-box-purple p {
            margin: 0;
            font-size: 12.5px;
            color: #6b21a8;
            line-height: 1.4;
            font-weight: 500;
        }

        .btn-action-wrapper {
            display: flex;
            justify-content: flex-end;
        }

        .btn-save-password {
            background-color: #6d28d9;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-save-password:hover {
            background-color: #5b21b6;
        }
    </style>
</head>
<body style="background-color: #F8FAFC; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div class="modal-card">
        
        <!-- Encabezado del Modal con Ícono Circular -->
        <div class="modal-header-custom">
            <div class="modal-icon-circle">
                <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
                </svg>
            </div>
            <div>
                <h2 class="modal-title-text">Crea una nueva contraseña</h2>
                <p class="modal-subtitle-text">Por seguridad, debes cambiar la contraseña temporal antes de continuar.</p>
            </div>
        </div>

        <!-- Formulario de Cambio de Contraseña -->
        <form th:action="@{/portalusuario/cambiar-password}" method="post">
            
            <div th:if="${errorMessage != null}" style="background-color: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;">
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- Campo Nueva Contraseña -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label class="form-label" style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px;">NUEVA CONTRASEÑA</label>
                <div class="input-icon-wrapper">
                    <svg class="input-icon-left" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="Mínimo 8 caracteres" required="required" />
                    <svg id="toggleNewPass" class="input-icon-right" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
                <div class="field-help-text">
                    <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Usa al menos 8 caracteres con letras y números
                </div>
            </div>

            <!-- Campo Confirmar Contraseña -->
            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px;">CONFIRMAR CONTRASEÑA</label>
                <div class="input-icon-wrapper">
                    <svg class="input-icon-left" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Repite tu nueva contraseña" required="required" />
                    <svg id="toggleConfirmPass" class="input-icon-right" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </div>
            </div>

            <!-- Nota Informativa Morada -->
            <div class="info-box-purple">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p>Una vez guardada, accederás directamente a tu panel de soporte en el Portal del Cliente de NovaTech Industries.</p>
            </div>

            <!-- Botón Guardar -->
            <div class="btn-action-wrapper">
                <button type="submit" class="btn-save-password">
                    <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Guardar contraseña
                </button>
            </div>
        </form>
    </div>

    <script>
        function setupToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (btn && input) {
                btn.addEventListener('click', function () {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                });
            }
        }
        setupToggle('toggleNewPass', 'newPassword');
        setupToggle('toggleConfirmPass', 'confirmPassword');
    </script>
</body>
</html>
