<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(
        ${modoEdicion ? 'Editar Agente' : 'Nuevo Agente'},
        'agentes',
        ~{::section})}">

<head>
    <title>Agente - ServiClient</title>
</head>

<body>

    <section>

        <div style="margin-bottom:24px;">

            <h1 style="
                font-size:28px;
                font-weight:800;
                margin-bottom:5px;
            " th:text="${modoEdicion
                ? 'Editar Agente'
                : 'Nuevo Agente'}">
                Nuevo Agente
            </h1>

            <p style="color:var(--color-text-muted);">
                Configura los datos y permisos del usuario interno.
            </p>

        </div>

        <div class="table-card" style="
            max-width:800px;
            padding:28px;
        ">

            <div th:if="${errorMessage != null}" style="
                background:#fef2f2;
                border:1px solid #fecaca;
                color:#991b1b;
                padding:12px 16px;
                border-radius:8px;
                margin-bottom:20px;
            " th:text="${errorMessage}">
            </div>

            <form th:action="${modoEdicion
                ? '/agentes/' + agenteId + '/editar'
                : '/agentes'}" th:object="${agenteDto}" method="post">

                <div class="form-row-2">

                    <div class="form-group">

                        <label class="form-label">
                            Nombre *
                        </label>

                        <input type="text" th:field="*{nombre}" class="form-input" required>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Apellido *
                        </label>

                        <input type="text" th:field="*{apellido}" class="form-input" required>

                    </div>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Correo electrónico *
                    </label>

                    <input type="email" th:field="*{email}" class="form-input" required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input type="text" th:field="*{telefono}" class="form-input">

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Rol *
                    </label>

                    <select th:field="*{rol}" class="form-input" required>

                        <option value="">
                            — Seleccionar —
                        </option>

                        <option th:each="rol : ${rolesDisponibles}" th:value="${rol}" th:text="${rol.descripcion}">
                        </option>

                    </select>

                </div>

                <div style="
                    display:flex;
                    justify-content:flex-end;
                    gap:10px;
                    margin-top:28px;
                    padding-top:20px;
                    border-top:1px solid var(--color-border);
                ">

                    <a th:href="@{/agentes}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary" th:text="${modoEdicion
                        ? 'Guardar cambios'
                        : 'Crear agente'}">
                        Crear agente
                    </button>

                </div>

            </form>

        </div>

    </section>

</body>

</html>
